version: v2
managed:
  enabled: true
  disable:
    - path: buf/validate/validate.proto
    - file_option: go_package_prefix
      path: buf/validate/validate.proto
  override:
    # Задаем чистый префикс для Go-импортов
    - file_option: go_package_prefix
      value: dmatech.ru/internal/pkg/contracts

plugins:
  - local: protoc-gen-go
    out: internal/pkg/contracts
    opt: paths=source_relative

  - local: protoc-gen-connect-go
    out: internal/pkg/contracts
    opt: paths=source_relative
