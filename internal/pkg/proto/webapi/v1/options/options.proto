syntax = "proto3";

package webapi.options.v1;

import "google/protobuf/descriptor.proto";

option go_package = "dmatech.ru/internal/pkg/proto/webapi/v1/options;optionsv1";

// public — отмечает конкретный webapi-RPC как доступный без авторизации.
// Гейтвей по умолчанию (default-deny) требует у каждого проксируемого
// запроса валидный access-токен (см. internal/pkg/authctx) — это явное,
// точечное исключение, которое объявляется рядом с самим RPC, в его .proto,
// а не в отдельном конфиге/списке на стороне гейтвея: иначе появление
// нового публичного метода требовало бы менять и деплоить гейтвей отдельно
// от модуля, который этот метод на самом деле определяет, и описание того,
// что публично, жило бы не там, где сам контракт.
//
// Гейтвей читает это значение прямо из FileDescriptorSet, который уже
// получает через discovery для маршрутизации (см. natsdiscovery,
// gateway/routes.go) — никакого отдельного канала передачи не требуется,
// как только сгенерированный Go-пакет этого файла где-то импортирован
// (регистрирует расширение в protoregistry.GlobalTypes), proto.GetExtension
// начинает его видеть — тот же механизм, что уже используется для
// buf.validate.field (см. internal/pkg/validation).
//
// Методы, которые по смыслу выполняются ДО того, как у клиента появляется
// токен (вход, регистрация, восстановление доступа, выдача PoW-challenge'а,
// обновление токена по refresh-куке), помечаются public = true явно —
// отсутствие пометки — это осознанный выбор "требует токен", а не
// недосмотр, который можно было бы принять по ошибке.
extend google.protobuf.MethodOptions {
  bool public = 50000;
}
