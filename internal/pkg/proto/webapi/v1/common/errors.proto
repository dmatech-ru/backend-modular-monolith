syntax = "proto3";

package webapi.common.errors.v1;

import "google/protobuf/struct.proto";


message ErrorPayload {
  int32               code    = 1;   
  string              message = 2;   
  repeated FieldError fields  = 3;   
}

message FieldError {
  string                 name    = 1;   
  string                 message = 2;   
  google.protobuf.Struct params  = 3;   
}