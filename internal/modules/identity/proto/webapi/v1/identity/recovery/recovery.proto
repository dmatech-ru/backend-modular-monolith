syntax = "proto3";

package webapi.identity.recovery.v1;

option go_package = "dmatech.ru/internal/modules/identity/proto/webapi/v1/identity/recovery;recoveryv1";

import "buf/validate/validate.proto";
import "webapi/v1/options/options.proto";

// IdentityRecoveryService — восстановление доступа: идентификатор →
// доступные способы получить код → выбор способа и отправка кода →
// подтверждение кода → сброс пароля.
//
// DeliveryChannel здесь — свой, webapi-локальный enum, а не
// peer.common.delivery.v1.DeliveryChannel из internal/pkg/proto (тот —
// зависимость конкретно peer-слоя: notifications и всё, что зовёт
// NotificationService напрямую по NATS, см. doc-комментарий там). webapi не
// импортирует файлы из-под peer/ ни при каких обстоятельствах — это и есть
// граница, которая не должна протекать: протекла бы, если бы этот enum
// переиспользовал peer-овский напрямую. Соответствие между этими двумя
// enum'ами (значения совпадают по смыслу: EMAIL/SMS/TELEGRAM/MAX) держит
// явная функция-маппер в Go (см. identity/handlers/webapi/v1/recovery.go),
// не общий тип.
//
// Каналы — не "привязанные к аккаунту заранее" сущности, а общие транспорты,
// через которые сервис умеет отправлять данные:
//   - EMAIL/SMS доступны, если у аккаунта есть email/телефон (identity.auth) —
//     туда и уходит код напрямую.
//   - TELEGRAM/MAX не требуют никакой предварительной привязки/сохранённого
//     chat_id: пользователь открывает бота и делится номером телефона через
//     штатный механизм бота ("поделиться контактом") — бот получает номер,
//     backend сверяет его с телефоном аккаунта и доставляет код в тот же
//     чат. Доступны при том же условии, что SMS (телефон на аккаунте есть),
//     механика доставки — через бота, не прямая отправка от backend. Это и
//     означает отсутствие masked_destination у этих двух каналов в
//     AvailableMethod — доставлять не на сохранённый адрес, а в чат,
//     который определится в момент обращения к боту.
//
// InitiateRecovery — тот же класс осознанной "утечки", что и
// IdentityRegistrationService.CheckIdentifier (см. комментарий там), только
// шире: раскрывает не просто факт существования аккаунта, а какие каналы
// восстановления ему доступны — соответственно, куда атакующему имеет
// смысл целиться. Поэтому доступные методы возвращаются с замаскированным
// destination (например "a***@example.com", "+7 *** *** **67"), не полным
// значением, и сам вызов требует PoW (pow_challenge/pow_nonce — см.
// webapi.captcha.v1.CaptchaService.IssueChallenge) и должен быть
// рейт-лимитирован на гейтвее (methodGuard), как и CheckIdentifier.
// SendRecoveryCode тоже под PoW — он запускает отправку кода реальному
// адресату (email/SMS) или активирует ожидание на стороне бота
// (Telegram/MAX), то есть это тот же вектор бомбёжки чужого канала, что у
// IdentityRegistrationService.StartPhoneVerification/StartEmailVerification.
//
// ResetPassword — пароль на сервер не передаётся: salt/verifier клиент
// вычисляет локально (как и везде в этом контракте, см.
// IdentityAuthService.CompleteAuthentication/
// IdentityRegistrationService.CompleteRegistration). После успешного сброса
// сервис фиксирует password_changed_at и возвращает frozen_until
// (unix-время) — до этого момента чувствительные действия с аккаунтом
// должны быть недоступны (длительность — passwordResetFreezeHours в
// конфиге identity). На момент этого контракта enforcement заморозки
// ограничен: других чувствительных операций (смена email/телефона и т.п.)
// в проекте пока не существует, так что frozen_until — это зафиксированный
// факт на будущее, а не действующий запрет прямо сейчас. Также гасит все
// существующие сессии пользователя (identity.sessions, см.
// internal/pkg/authctx) — после сброса пароля ни один ранее выданный
// refresh-токен больше не ротируется.
//
// identifier — email, телефон или username (identity.auth.username,
// миграция 0011); регистронезависимо для email/username. Ни один текущий
// write-путь (регистрация) username не задаёт — колонка пуста у всех
// аккаунтов, пока в IdentityRegistrationService не появится отдельный шаг
// для его выбора, но поиск (FindAuth) его уже учитывает.
service IdentityRecoveryService {
  // InitiateRecovery проверяет identifier и возвращает доступные способы
  // восстановления. STATUS_NOT_FOUND и список способов — по одному и тому
  // же классу причин неотличимы от STATUS_CAPTCHA_REQUIRED только в
  // смысле "не раскрыто больше, чем должно": см. комментарий сервиса.
  rpc InitiateRecovery (InitiateRecoveryRequest) returns (InitiateRecoveryResponse) {
    option (webapi.options.v1.public) = true;
  }

  // SendRecoveryCode отправляет одноразовый код по выбранному каналу.
  // Канал должен быть среди тех, что InitiateRecovery перечислил как
  // доступные для этой сессии — иначе INVALID_ARGUMENT. Повторный вызов
  // (в том числе с другим каналом) — переотправка, старый код перестаёт
  // быть действителен.
  rpc SendRecoveryCode (SendRecoveryCodeRequest) returns (SendRecoveryCodeResponse) {
    option (webapi.options.v1.public) = true;
  }

  // ConfirmRecoveryCode проверяет код. Неверный код — UNAUTHENTICATED;
  // истёкший/некорректный recovery_session_id — NOT_FOUND; слишком много
  // неверных попыток — RESOURCE_EXHAUSTED (лимит — тот же, что у
  // IdentityRegistrationService: 5 попыток на код).
  rpc ConfirmRecoveryCode (ConfirmRecoveryCodeRequest) returns (ConfirmRecoveryCodeResponse) {
    option (webapi.options.v1.public) = true;
  }

  // ResetPassword — финальный шаг, требует подтверждённого кода в этой
  // сессии (иначе FAILED_PRECONDITION). Завершает сессию восстановления
  // (одноразовая, повторный вызов — NOT_FOUND).
  rpc ResetPassword (ResetPasswordRequest) returns (ResetPasswordResponse) {
    option (webapi.options.v1.public) = true;
  }
}

// DeliveryChannel — см. doc-комментарий сервиса выше про то, почему это
// отдельный от peer.common.delivery.v1.DeliveryChannel enum, не
// переиспользование общего.
enum DeliveryChannel {
  DELIVERY_CHANNEL_UNSPECIFIED = 0;
  DELIVERY_CHANNEL_EMAIL = 1;
  DELIVERY_CHANNEL_SMS = 2;
  DELIVERY_CHANNEL_TELEGRAM = 3;
  DELIVERY_CHANNEL_MAX = 4;
}

message InitiateRecoveryRequest {
  // identity.identifier.required — тот же ключ, что у
  // IdentityAuthService.InitializeSession/IdentityRegistrationService.
  // CheckIdentifier (один смысл поля — один ключ, см. doc-комментарий
  // ErrorPayload в webapi/v1/common/errors.proto).
  string identifier = 1 [(buf.validate.field).cel = {
    id: "identity.identifier.required"
    message: "identifier must not be empty"
    expression: "!this.matches('^\\\\s*$')"
  }];
  // pow_challenge/pow_nonce — см. комментарий сервиса; пусты в первой
  // попытке, заполняются после получения STATUS_CAPTCHA_REQUIRED. Не
  // required: пустое значение здесь легитимно (первая попытка), не ошибка.
  string pow_challenge = 2;
  string pow_nonce = 3;
}

message AvailableMethod {
  DeliveryChannel channel = 1;
  // masked_destination — замаскированный адрес/номер (например
  // "a***@example.com", "+7 *** *** **67") для EMAIL/SMS; пусто для
  // TELEGRAM/MAX — у них нет сохранённого адреса, доставка идёт в чат,
  // который определится через бота (см. комментарий сервиса).
  string masked_destination = 2;
}

message InitiateRecoveryResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_AVAILABLE = 1;
    STATUS_NOT_FOUND = 2;
    STATUS_CAPTCHA_REQUIRED = 3;
  }
  Status status = 1;
  // recovery_session_id заполнен только при status == STATUS_AVAILABLE.
  string recovery_session_id = 2;
  // available_methods заполнен только при status == STATUS_AVAILABLE.
  repeated AvailableMethod available_methods = 3;
}

message SendRecoveryCodeRequest {
  string recovery_session_id = 1 [(buf.validate.field).cel = {
    id: "identity.recovery_session_id.required"
    message: "recovery_session_id must not be empty"
    expression: "!this.matches('^\\\\s*$')"
  }];
  // channel: доступность конкретного канала для этой сессии — бизнес-правило
  // (см. SendRecoveryCode в хендлере), не статическая форма, поэтому вне
  // buf.validate; DELIVERY_CHANNEL_UNSPECIFIED тоже отсекается там же.
  DeliveryChannel channel = 2;
  string pow_challenge = 3;
  string pow_nonce = 4;
}

message SendRecoveryCodeResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_SENT = 1;
    STATUS_CAPTCHA_REQUIRED = 2;
  }
  Status status = 1;
}

message ConfirmRecoveryCodeRequest {
  string recovery_session_id = 1 [(buf.validate.field).cel = {
    id: "identity.recovery_session_id.required"
    message: "recovery_session_id must not be empty"
    expression: "!this.matches('^\\\\s*$')"
  }];
  // identity.code.required — тот же ключ, что у Confirm{Phone,Email}
  // VerificationRequest.code в registration.proto.
  string code = 2 [(buf.validate.field).cel = {
    id: "identity.code.required"
    message: "code must not be empty"
    expression: "!this.matches('^\\\\s*$')"
  }];
}

message ConfirmRecoveryCodeResponse {}

message ResetPasswordRequest {
  string recovery_session_id = 1 [(buf.validate.field).cel = {
    id: "identity.recovery_session_id.required"
    message: "recovery_session_id must not be empty"
    expression: "!this.matches('^\\\\s*$')"
  }];
  // salt, verifier — см. комментарий сервиса; как и в
  // IdentityRegistrationService.CompleteRegistration, пароль сюда не попадает.
  // identity.salt.required — тот же ключ, что у CompleteRegistrationRequest.salt.
  bytes salt = 2 [(buf.validate.field).cel = {
    id: "identity.salt.required"
    message: "salt must not be empty"
    expression: "this.size() > 0"
  }];
  // verifier — форма (не просто "непусто", а правдоподобный элемент группы
  // SRP) проверяется в Go (srp.ValidVerifier), не здесь: граница размера —
  // деталь реализации SRP-группы (internal/pkg/srp), а не формы запроса,
  // дублировать её магическим числом в .proto не стоит.
  bytes verifier = 3;
}

message ResetPasswordResponse {
  // frozen_until — unix-время (секунды), до которого чувствительные
  // действия с аккаунтом должны считаться недоступными (см. комментарий
  // сервиса про текущие границы enforcement).
  int64 frozen_until = 1;
}
