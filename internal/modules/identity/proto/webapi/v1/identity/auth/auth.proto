syntax = "proto3";

package webapi.identity.auth.v1;

option go_package = "dmatech.ru/internal/modules/identity/proto/webapi/v1/identity/auth;authv1";

// IdentityAuthService — только SRP-вход для уже существующих аккаунтов.
// Регистрация — отдельный, многошаговый контракт, см.
// IdentityRegistrationService в registration.proto (свой пакет, см. там; бывший
// одношаговый Register здесь заменён её CompleteRegistration: он не
// проверял владение телефоном/почтой вообще).
service IdentityAuthService {
  // InitializeSession начинает вход по identifier (email или телефон) и
  // возвращает параметры SRP-обмена (соль и публичное значение сервера) для
  // второго шага. Если учётной записи с таким identifier не существует,
  // возвращает ошибку NOT_FOUND.
  rpc InitializeSession (InitializeSessionRequest) returns (InitializeSessionResponse);

  // CompleteAuthentication — второй шаг SRP: клиент доказывает знание пароля
  // (client_proof), сервер проверяет его и в ответ присылает собственное
  // доказательство (server_proof) для взаимной аутентификации. Session_id
  // одноразовый: повторный вызов с тем же значением вернёт NOT_FOUND.
  rpc CompleteAuthentication (CompleteAuthenticationRequest) returns (CompleteAuthenticationResponse);
}

message InitializeSessionRequest {
  string identifier = 1;
}

message InitializeSessionResponse {
  // session_id — непрозрачный идентификатор SRP-обмена, нужен на втором шаге.
  string session_id = 1;
  // salt — соль (s), привязанная к учётной записи.
  bytes salt = 2;
  // server_public — публичное эфемерное значение сервера (B).
  bytes server_public = 3;
}

message CompleteAuthenticationRequest {
  string session_id = 1;
  // client_public — публичное эфемерное значение клиента (A).
  bytes client_public = 2;
  // client_proof — доказательство клиента (M1).
  bytes client_proof = 3;
}

message CompleteAuthenticationResponse {
  // server_proof — доказательство сервера (M2): клиент проверяет его, чтобы
  // убедиться, что говорит с сервером, который действительно знает verifier.
  bytes server_proof = 1;
}
