services:
  nats:
    image: nats:2.12-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data

  app:
    build: .
    profiles: ["app"]
    environment:
      NATS_URL: nats://nats:4222
    ports:
      - "1987:1987"
    depends_on:
      - nats

volumes:
  nats-data:
